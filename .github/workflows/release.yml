name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar deps GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 libadwaita-1-0 gir1.2-adw-1 python3-venv xvfb
      - name: Tests
        run: |
          python3 -m venv --system-site-packages .venv
          xvfb-run -a .venv/bin/python -m unittest discover -s tests

  deb:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar deps GTK + herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 libadwaita-1-0 gir1.2-adw-1 xvfb
      - name: Construir .deb
        run: packaging/build_deb.sh
      - name: Instalar y smoke test
        run: |
          sudo dpkg -i dist/fancyprojects_*_all.deb || sudo apt-get -f install -y
          xvfb-run -a bash -c '
            fancyprojects &
            PID=$!
            sleep 5
            if kill -0 "$PID" 2>/dev/null; then
              echo "App viva bajo Xvfb -> OK"
              kill "$PID"
            else
              wait "$PID"; echo "Terminó con exit=$? -> FALLO"; exit 1
            fi'
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/fancyprojects_*_all.deb

  appimage:
    needs: test
    # Ubuntu 24.04: libadwaita >= 1.4 requerida (Adw.Dialog).
    # El AppImage empaqueta su propio GTK/libadwaita: el "suelo" de
    # compatibilidad es glibc 2.39 (Ubuntu 24.04+, Debian 13+, Mint 22+).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar deps GTK + herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 libadwaita-1-0 gir1.2-adw-1 xvfb python3-venv
      - name: Construir AppImage
        run: packaging/build_appimage.sh
      - name: Smoke test
        run: |
          xvfb-run -a bash -c '
            APPIMAGE_EXTRACT_AND_RUN=1 ./dist/FancyProjects-*.AppImage &
            PID=$!
            sleep 6
            if kill -0 "$PID" 2>/dev/null; then
              echo "AppImage vivo -> OK"
              kill "$PID"
            else
              wait "$PID"; echo "Terminó con exit=$? -> FALLO"; exit 1
            fi'
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/FancyProjects-*.AppImage

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Homebrew + GTK
        run: |
          brew install gtk4 libadwaita pygobject3 adwaita-icon-theme python
      - name: Construir .app + dmg
        run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/FancyProjects-*-macos.dmg

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-nsis
      - name: Construir exe + instalador
        shell: msys2 {0}
        run: bash packaging/build_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/fancyprojects/**
            dist/FancyProjects-*-windows-installer.exe

  release:
    needs: [deb, appimage, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Crear tarball del código fuente
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          git archive --format=tar.gz -o "fancyprojects-${TAG}.tar.gz" \
            --prefix="fancyprojects-${TAG}/" HEAD
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            artifacts/deb/* \
            artifacts/appimage/* \
            artifacts/macos/* \
            artifacts/windows/FancyProjects-*-windows-installer.exe \
            "fancyprojects-${TAG}.tar.gz" \
            --generate-notes \
            --repo "${{ github.repository }}" || true